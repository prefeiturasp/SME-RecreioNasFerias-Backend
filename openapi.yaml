openapi: 3.0.3
info:
  title: SME Recreio Nas Ferias Backend API
  version: 1.0.0
  description: Documentacao OpenAPI dos endpoints de usuarios e autenticacao.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Autentica usuario via API externa e retorna tokens.
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Payload invalido ou dados invalidos
        '401':
          description: Credenciais invalidas
        '403':
          description: Cargo nao autorizado para o sistema
        '502':
          description: Falha de integracao externa
  /api/schema/:
