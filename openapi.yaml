  /api/usuarios/:
    get:
      operationId: usuarios_retrieve
      description: Despacha requisições de coleção de usuários.
      tags:
      - Usuarios
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Lista de usuarios
    post:
      operationId: usuarios_create
      description: Despacha requisições de coleção de usuários.
      tags:
      - Usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsuarioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUsuarioRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          description: Usuario criado com sucesso
  /api/usuarios/{user_id}/:
    get:
      operationId: usuarios_retrieve_2
      description: Despacha requisições de item de usuário por id.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Usuarios
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Usuario encontrado
    put:
      operationId: usuarios_update
      description: Despacha requisições de item de usuário por id.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsuarioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUsuarioRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Usuario atualizado
    delete:
      operationId: usuarios_destroy
      description: Despacha requisições de item de usuário por id.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Usuarios
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: Usuario removido
components:
  schemas:
    CreateUsuarioRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - nome
    LoginRequest:
      type: object
      properties:
        login:
          type: string
        senha:
          type: string
      required:
      - login
      - senha
    LoginResponse:
      type: object
      properties:
        usuarioId:
          type: string
        status:
          type: integer
        nome:
          type: string
        codigoRf:
          type: string
      required:
      - codigoRf
      - nome
      - status
      - usuarioId
    UpdateUsuarioRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
