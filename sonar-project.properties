# Identificação do projeto no SonarQube
sonar.projectKey=SME-RecreioNasFerias-Backend
sonar.projectName=SME-RecreioNasFerias-Backend
sonar.projectVersion=1.0

# Diretórios do código-fonte da aplicação
sonar.sources=apps,config

# Diretórios que contêm testes
sonar.tests=apps,testes
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py,testes/**/*.py

# Linguagem principal.
# Propriedade legada mantida para compatibilidade com instalações antigas.
sonar.language=py

# Encoding dos arquivos
sonar.sourceEncoding=UTF-8

# Arquivos e diretórios que não devem ser analisados como código-fonte
sonar.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/test_*.py,\
  **/conftest.py,\
  **/factories.py,\
  apps/conftest.py,\
  apps/factories.py,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/venv/**,\
  **/.venv/**,\
  **/env/**,\
  **/.git/**,\
  **/docs/**,\
  **/staticfiles/**,\
  **/testes/**,\
  config/settings.py,\
  config/wsgi.py,\
  config/asgi.py,\
  config/urls.py,\
  manage.py
  

# Arquivos de teste que não devem ser considerados para métricas de teste
sonar.test.exclusions=\
  **/conftest.py,\
  **/factories.py,\
  apps/conftest.py,\
  apps/factories.py

# Arquivos sem cobertura de negócio direta
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/test_*.py,\
  **/conftest.py,\
  **/factories.py,\
  apps/conftest.py,\
  apps/factories.py,\
  **/apps.py,\
  **/admin.py,\
  manage.py,\
  config/**

# Relatório XML de cobertura gerado pelo Coverage.py
sonar.python.coverage.reportPaths=coverage.xml

# Versão Python utilizada pelo projeto
sonar.python.version=3.12
